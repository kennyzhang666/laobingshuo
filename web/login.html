<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 老兵说</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:20px;color:#e8eef8;
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    background:#05080f radial-gradient(700px 500px at 20% 10%,rgba(34,211,238,.14),transparent 60%),
               radial-gradient(700px 500px at 90% 90%,rgba(244,114,182,.1),transparent 60%)}
  .card{width:min(100%,400px);padding:34px 32px;border-radius:22px;border:1px solid rgba(120,180,255,.15);
    background:rgba(14,22,40,.8);box-shadow:0 40px 100px -30px rgba(0,0,0,.8)}
  .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:2px}
  .brand i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:16px;color:#05080f;
    background:conic-gradient(from 200deg,#22d3ee,#f472b6,#fbbf24,#22d3ee)}
  .sub{color:#8796b0;font-size:13px;margin:6px 0 24px}
  .err{display:none;margin-bottom:14px;padding:10px 12px;border-radius:10px;font-size:13px;color:#fda4af;
    border:1px solid rgba(244,114,182,.35);background:rgba(244,114,182,.08)}
  .err[data-state="visible"]{display:block}
  label{display:block;font-size:13px;color:#8796b0;margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(120,180,255,.18);background:rgba(255,255,255,.04);
    color:inherit;font:inherit;outline:none}
  input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.15)}
  button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;color:#05080f;
    background:linear-gradient(90deg,#22d3ee,#60a5fa)}
  .foot{margin-top:16px;text-align:center;font-size:12px;color:#5f6f8a}
  .foot a{color:#8796b0}
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><i>说</i>老兵说</div>
    <p class="sub">分组核心网控制开发部</p>
    <div class="err" role="alert" data-state="{{ERROR_STATE}}">{{ERROR}}</div>
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="returnTo" value="{{RETURN_TO}}">
      <label for="userId">工号</label>
      <input id="userId" name="userId" autocomplete="username" placeholder="请输入工号" maxlength="128" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入域账号密码" required>
      <button type="submit">登录</button>
    </form>
    <p class="foot">LDAP 域账号统一认证 · <a href="/">返回首页</a></p>
  </main>
</body>
</html>
